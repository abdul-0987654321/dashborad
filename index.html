<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashborad — Shop Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F3B36;
  --ink-light:#2E5750;
  --paper:#FAF8F1;
  --paper-dim:#F1EDE0;
  --card:#FFFFFF;
  --border:#DED6C0;
  --gold:#B8901F;
  --gold-light:#EFDFA9;
  --brick:#A63D40;
  --brick-light:#F3DCDB;
  --muted:#7A7360;
  --text:#242019;
  --shadow: 0 1px 2px rgba(31,59,54,0.06), 0 4px 12px rgba(31,59,54,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'IBM Plex Sans',sans-serif;
  background:var(--paper);
  color:var(--text);
  min-height:100vh;
}
h1,h2,h3,.slab{font-family:'Zilla Slab',serif;}
.num,table td.num,.amount{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ===== App shell ===== */
#app{display:flex; min-height:100vh;}

.sidebar{
  width:220px; flex-shrink:0;
  background:var(--ink);
  color:#EFE9D8;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{
  padding:22px 20px 16px 20px;
  border-bottom:1px solid rgba(239,233,216,0.15);
  display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
}
.brand .brand-text{min-width:0; flex:1;}
.brand .mark{
  font-family:'Zilla Slab',serif; font-weight:700; font-size:22px;
  color:#EFE9D8; letter-spacing:0.5px;
}
.brand .sub{font-size:11px; color:var(--gold-light); letter-spacing:1.5px; text-transform:uppercase; margin-top:2px;}
.sidebar-close{
  display:none; background:rgba(239,233,216,0.12); border:none; color:#EFE9D8;
  width:34px; height:34px; border-radius:8px; font-size:20px; line-height:1; flex-shrink:0;
  align-items:center; justify-content:center;
}
.sidebar-close:hover{ background:rgba(239,233,216,0.22); }
@media (max-width:860px){ .sidebar-close{ display:inline-flex; } }

.navlist{list-style:none; margin:0; padding:10px 0; flex:1; overflow-y:auto;}
.navlist li{margin:2px 10px;}
.navlist button{
  width:100%; text-align:left; background:none; border:none; color:#D9D2BC;
  padding:10px 12px; border-radius:6px; font-size:14.5px; display:flex; align-items:center; gap:10px;
  transition:background .15s ease, color .15s ease;
}
.navlist button .ico{width:18px; text-align:center; opacity:0.85; font-size:15px;}
.navlist button:hover{background:rgba(239,233,216,0.08); color:#fff;}
.navlist button.active{background:var(--gold); color:var(--ink); font-weight:600;}
.navlist button.active .ico{opacity:1;}

.sidebar-foot{padding:14px 20px; font-size:11px; color:#8FA69F; border-top:1px solid rgba(239,233,216,0.12);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  padding:18px 28px; background:var(--card); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5;
}
.topbar h1{margin:0; font-size:21px; font-weight:600; color:var(--ink);}
.topbar .date{font-size:13px; color:var(--muted);}
.content{padding:26px 28px 60px 28px; flex:1;}

/* ===== Cards / grid ===== */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-bottom:22px;}
.stat-card{
  background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px;
  box-shadow:var(--shadow); position:relative; overflow:hidden;
  display:flex; align-items:flex-start; gap:13px;
  transition:transform .15s ease, box-shadow .15s ease;
}
.stat-card:hover{ transform:translateY(-2px); box-shadow:0 4px 8px rgba(31,59,54,0.08), 0 10px 22px rgba(31,59,54,0.08); }
.stat-card .sic{
  width:38px; height:38px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--gold-light); color:#6B4E00; font-size:17px;
}
.stat-card.warn .sic{ background:var(--brick-light); color:var(--brick); }
.stat-card .sbody{min-width:0; flex:1;}
.stat-card .label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.stat-card .value{font-family:'Zilla Slab',serif; font-size:24px; font-weight:700; color:var(--ink); line-height:1.15;}
.stat-card .trend-row{margin-top:3px;}
.stat-card .subnote{font-size:11px; color:var(--muted); margin-top:4px; line-height:1.4;}
.stat-card.accent{border-color:var(--gold);}
.stat-card.warn .value{color:var(--brick);}
.stat-card .bar{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--gold);}
.stat-card.warn .bar{background:var(--brick);}
.greeting{font-size:13px; color:var(--muted); margin:-6px 0 16px 0;}
.greeting strong{color:var(--ink);}

.panel{background:var(--card); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); margin-bottom:20px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
.panel-head h2{margin:0; font-size:16px; color:var(--ink); font-weight:600;}
.panel-head .panel-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
.panel-body{padding:18px 20px;}

.btn{
  border:1px solid var(--ink); background:var(--ink); color:#fff; padding:9px 16px; border-radius:7px;
  font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition:opacity .15s;
}
.btn:hover{opacity:0.88;}
.btn.gold{background:var(--gold); border-color:var(--gold); color:#2A2100;}
.btn.outline{background:transparent; color:var(--ink);}
.btn.brick{background:var(--brick); border-color:var(--brick);}
.btn.small{padding:5px 10px; font-size:12.5px; border-radius:6px;}
.btn:disabled{opacity:0.4; cursor:not-allowed;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); padding:8px 10px; border-bottom:2px solid var(--border);}
td{padding:10px 10px; border-bottom:1px solid var(--paper-dim);}
tr:last-child td{border-bottom:none;}
td.num, th.num{text-align:right;}
.pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:600;}
.pill.low{background:var(--brick-light); color:var(--brick);}
.pill.ok{background:#DCEAE2; color:var(--ink-light);}
.pill.credit{background:var(--gold-light); color:#6B4E00;}
.pill.cash{background:#DCEAE2; color:var(--ink-light);}
.pill.card{background:#E1E6F0; color:#38477A;}

.empty{padding:36px 20px; text-align:center; color:var(--muted);}
.empty .big{font-size:32px; margin-bottom:8px;}

.row-actions{display:flex; gap:6px;}
.icon-btn{background:none; border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:12.5px; color:var(--ink);}
.icon-btn:hover{background:var(--paper-dim);}
.icon-btn.del{color:var(--brick); border-color:var(--brick-light);}

/* forms */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.field{display:flex; flex-direction:column; gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.4px;}
.field input, .field select, .field textarea{
  padding:9px 11px; border:1px solid var(--border); border-radius:7px; font-size:14px; background:var(--paper);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold); outline-offset:0; border-color:var(--gold);}

/* modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(31,25,15,0.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{background:var(--card); border-radius:12px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
.modal-head h3{margin:0; font-size:17px; color:var(--ink);}
.modal-close{background:none; border:none; font-size:20px; color:var(--muted); line-height:1;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:14px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}

/* POS */
.pos-grid{display:grid; grid-template-columns:1fr 360px; gap:18px; align-items:start;}
.pos-search{margin-bottom:14px;}
.pos-search input{width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:8px; font-size:14.5px; background:var(--card);}
.product-tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
.tile{
  background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:left;
  display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); position:relative;
}
.tile:hover{border-color:var(--gold);}
.tile:disabled{opacity:0.4; cursor:not-allowed;}
.tile .cat{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;}
.tile .name{font-weight:600; font-size:14px; color:var(--ink); line-height:1.25;}
.tile .price{font-family:'IBM Plex Mono',monospace; color:var(--gold); font-weight:600; font-size:14.5px; margin-top:auto;}
.tile .stockflag{position:absolute; top:10px; right:10px; font-size:10px; padding:1px 7px; border-radius:10px; background:var(--brick-light); color:var(--brick); font-weight:600;}

.cart-panel{background:var(--card); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); position:sticky; top:88px;}
.cart-head{padding:16px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
.cart-head h3{margin:0; font-size:15px; color:var(--ink);}
.cart-items{max-height:280px; overflow-y:auto; padding:8px 14px;}
.cart-item{display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--paper-dim);}
.cart-item:last-child{border-bottom:none;}
.cart-item .ci-name{flex:1; font-size:13px; font-weight:600; color:var(--text);}
.cart-item .ci-price{font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}
.qty-ctrl{display:flex; align-items:center; gap:6px;}
.qty-ctrl button{width:22px; height:22px; border-radius:5px; border:1px solid var(--border); background:var(--paper-dim); font-size:13px; line-height:1;}
.qty-ctrl span{width:20px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:13px;}
.ci-remove{background:none; border:none; color:var(--brick); font-size:15px; padding:0 4px;}
.cart-empty{padding:30px 14px; text-align:center; color:var(--muted); font-size:13px;}
.cart-foot{padding:14px 18px 18px 18px; border-top:1px solid var(--border);}
.cart-line{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:8px; color:var(--muted);}
.cart-line.total{font-size:18px; font-weight:700; color:var(--ink); font-family:'Zilla Slab',serif; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
.cart-foot .field{margin-bottom:10px;}
.pay-options{display:flex; gap:8px; margin-bottom:12px;}
.pay-options button{flex:1; padding:8px 6px; border-radius:7px; border:1px solid var(--border); background:var(--paper-dim); font-size:12.5px; font-weight:600; color:var(--muted);}
.pay-options button.sel{background:var(--ink); color:#fff; border-color:var(--ink);}

/* Receipt */
.receipt-wrap{display:flex; justify-content:center; padding:20px 0;}
.receipt{
  width:320px; background:#FFFDF7; padding:26px 22px 30px 22px; position:relative;
  box-shadow:0 6px 24px rgba(0,0,0,0.15);
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#2A251A;
  background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, #EFE9D5 28px);
}
.receipt::before, .receipt::after{
  content:""; position:absolute; left:0; right:0; height:14px;
  background: radial-gradient(circle at 8px 0, transparent 7px, #FFFDF7 7px) repeat-x; background-size:16px 14px;
}
.receipt::before{top:-7px;}
.receipt::after{bottom:-7px; transform:rotate(180deg);}
.receipt h2{font-family:'Zilla Slab',serif; text-align:center; margin:0 0 2px 0; font-size:18px; color:var(--ink);}
.receipt .rsub{text-align:center; font-size:10.5px; color:var(--muted); margin-bottom:14px;}
.receipt .rline{display:flex; justify-content:space-between; margin:3px 0;}
.receipt hr{border:none; border-top:1px dashed #B8AF8F; margin:10px 0;}
.receipt .ritem{display:flex; justify-content:space-between; margin:4px 0;}
.receipt .ritem .n{max-width:180px;}
.receipt .rtotal{font-weight:700; font-size:14px;}
.receipt-actions{display:flex; gap:10px; justify-content:center; margin-top:6px; flex-wrap:wrap;}

/* Reports */
.chart-bars{display:flex; align-items:flex-end; gap:8px; height:160px; padding:10px 4px 0 4px;}

/* Dashboard v2 */
.quick-actions{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
.qa-btn{
  background:var(--card); border:1px solid var(--border); border-radius:9px; padding:11px 18px;
  font-size:13.5px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:8px; box-shadow:var(--shadow);
  transition:transform .12s ease, border-color .12s ease;
}
.qa-btn:hover{border-color:var(--gold); transform:translateY(-1px);}
.qa-btn.qa-primary{background:var(--ink); color:#fff; border-color:var(--ink);}
.qa-ico{font-size:15px; opacity:0.85;}
.dash-split{display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-bottom:20px; align-items:stretch;}
@media (max-width:900px){ .dash-split{grid-template-columns:1fr;} }
.snapshot-row{display:flex; justify-content:space-between; align-items:center; padding:11px 2px; border-bottom:1px solid var(--paper-dim);}
.snapshot-row:last-child{border-bottom:none;}
.snap-label{font-size:13px; color:var(--muted);}
.snap-value{font-size:14px; font-weight:600; color:var(--ink); font-family:'IBM Plex Mono',monospace;}
.bar-today{background:var(--ink) !important;}

.chart-bars .bwrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
.chart-bars .bar{width:100%; max-width:34px; background:var(--gold); border-radius:4px 4px 0 0; transition:height .3s ease;}
.chart-bars .blabel{font-size:10px; color:var(--muted); margin-top:6px; text-align:center;}
.chart-bars .bval{font-size:10px; color:var(--ink); font-weight:600; margin-bottom:4px; font-family:'IBM Plex Mono',monospace;}

.tabs{display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--border);}
.tabs button{padding:9px 14px; background:none; border:none; border-bottom:2px solid transparent; font-size:13.5px; color:var(--muted); font-weight:600;}
.tabs button.active{color:var(--ink); border-color:var(--gold);}

.search-bar{margin-bottom:14px;}
.search-bar input{padding:9px 13px; border:1px solid var(--border); border-radius:7px; font-size:13.5px; width:280px; max-width:100%; background:var(--card);}

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff;
  padding:11px 20px; border-radius:8px; font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,0.25); opacity:0; transition:all .25s ease; z-index:200; pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media print{
  .no-print{display:none !important;}
  .sidebar, .topbar{display:none !important;}
  body{background:#fff;}
  .receipt-wrap{padding:0;}
}

@media (max-width: 860px){
  .sidebar{position:fixed; left:-240px; z-index:50; transition:left .2s ease; width:240px; box-shadow:0 0 0 9999px rgba(0,0,0,0);}
  .sidebar.open{left:0; box-shadow:8px 0 24px rgba(0,0,0,0.25);}
  .pos-grid{grid-template-columns:1fr;}
  .cart-panel{position:static;}
  .content{padding:14px;}
  .topbar{padding:12px 14px; flex-wrap:wrap; row-gap:8px;}
  .form-grid{grid-template-columns:1fr;}
  /* Prefer single-column cards on tablet/phone */
  .stat-grid{ grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .dash-split{ grid-template-columns:1fr; }
}

/* Overlay behind the sidebar when open on mobile, tap to close */
.sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:45;}
@media (max-width:860px){ .sidebar-overlay.show{display:block;} }

/* Prevent the topbar (title + date + lang toggle) from overflowing on narrow phones */
@media (max-width:640px){
  .topbar .date{display:none;}
  .topbar h1{font-size:17px;}
  .lang-toggle{margin-left:0;}
}
@media (max-width:400px){
  .topbar{gap:8px;}
}

.menu-toggle{display:none; background:none; border:1px solid var(--border); border-radius:7px; padding:7px 10px; font-size:16px;}
@media (max-width:860px){ .menu-toggle{display:inline-flex;} }

/* ===== Mobile usability pass ===== */
@media (max-width:640px){
  /* Wrap wide tables in a horizontal scroller instead of squishing columns unreadably */
  .panel-body{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ min-width:520px; }

  /* Bigger, thumb-friendly tap targets */
  .btn{ padding:11px 16px; font-size:14px; }
  .icon-btn{ padding:8px 11px; font-size:13px; }
  .qty-ctrl button{ width:30px; height:30px; font-size:15px; }
  .navlist button{ padding:13px 12px; font-size:15px; }
  .tile{ padding:12px; }

  /* Inputs at 16px+ so iOS Safari doesn't zoom in on focus */
  .field input, .field select, .field textarea,
  .search-bar input, .pos-search input, #prodCatFilter, #expCatFilter{ font-size:16px; }

  /* Stat cards: single column, roomier */
  .stat-grid{ grid-template-columns:1fr; }

  /* Quick actions stack full-width on very small phones */
  .quick-actions{ flex-direction:column; }
  .quick-actions .qa-btn{ width:100%; justify-content:center; }

  /* Modal fills more of the screen, no dead space at the edges */
  .modal-backdrop{ padding:0; align-items:flex-end; }
  .modal{ max-width:100%; width:100%; max-height:92vh; border-radius:16px 16px 0 0; }

  /* Smaller receipt so it fits without horizontal scrolling */
  .receipt{ width:88vw !important; max-width:320px; padding:20px 16px 24px 16px; }

  /* Product tiles: 2 per row minimum, no overflow */
  .product-tiles{ grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:9px; }

  .search-bar input{ width:100%; }
}

/* Urdu / RTL support */
body.lang-ur{ font-family:'Noto Nastaliq Urdu','IBM Plex Sans',sans-serif; }
body.lang-ur .content, body.lang-ur .sidebar, body.lang-ur .topbar, body.lang-ur .modal{ direction:rtl; text-align:right; }
body.lang-ur .navlist button{ text-align:right; flex-direction:row-reverse; }
body.lang-ur th, body.lang-ur td{ text-align:right; }
body.lang-ur th.num, body.lang-ur td.num{ text-align:left; }
body.lang-ur .amount, body.lang-ur .num{ direction:ltr; unicode-bidi:embed; }
body.lang-ur .brand{ text-align:right; }
body.lang-ur .cart-line, body.lang-ur .rline, body.lang-ur .ritem{ direction:rtl; }
body.lang-ur .field label{ text-align:right; }

.lang-toggle{
  display:flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; margin-left:12px;
}
.lang-toggle button{
  padding:6px 12px; border:none; background:var(--card); color:var(--muted); font-size:12.5px; font-weight:600;
}
.lang-toggle button.active{ background:var(--gold); color:#2A2100; }

/* Thermal slip receipt sizing */
.slip-size-row{ display:flex; gap:8px; justify-content:center; margin-bottom:14px; align-items:center; }
.slip-size-row span{ font-size:12px; color:var(--muted); }
.slip-size-row button{ padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:var(--paper-dim); font-size:12px; font-weight:600; color:var(--muted); }
.slip-size-row button.sel{ background:var(--ink); color:#fff; border-color:var(--ink); }

@media print{
  body.lang-ur .receipt{ direction:rtl; }
}

/* Cloud sync status pill (sidebar) */
.sync-status{ display:flex; align-items:center; gap:6px; font-size:11px; margin-top:8px; }
.sync-dot{ width:7px; height:7px; border-radius:50%; background:#8FA69F; flex-shrink:0; }
.sync-dot.ok{ background:#6FBF8B; }
.sync-dot.busy{ background:var(--gold-light); animation:pulse 1s infinite ease-in-out; }
.sync-dot.err{ background:var(--brick); }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* ===== Login screen ===== */
.login-wrap{
  position:fixed; inset:0; z-index:999;
  display:flex; align-items:center; justify-content:center;
  padding:24px; overflow-y:auto; background:
    radial-gradient(circle at 15% 15%, rgba(184,144,31,0.10), transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(31,59,54,0.08), transparent 40%),
    var(--paper);
}
.login-card{
  width:100%; max-width:360px; background:var(--card); border:1px solid var(--border); border-radius:16px;
  box-shadow:0 20px 50px rgba(31,59,54,0.12); padding:32px 26px 28px 26px;
}
.login-brand{ text-align:center; margin-bottom:22px; }
.login-brand .mark{ font-family:'Zilla Slab',serif; font-weight:700; font-size:30px; color:var(--ink); }
.login-brand .sub{ font-size:12px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-top:4px; }
.login-field{ margin-bottom:16px; }
.login-field label{ display:block; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px; }
.login-field input{
  width:100%; padding:14px 14px; border:1px solid var(--border); border-radius:10px; font-size:16px; background:var(--paper);
}
.login-field input:focus{ outline:2px solid var(--gold); outline-offset:0; border-color:var(--gold); }
.login-error{ background:var(--brick-light); color:var(--brick); font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:14px; display:none; }
.login-error.show{ display:block; }
.login-btn{
  width:100%; padding:14px; border-radius:10px; border:1px solid var(--ink); background:var(--ink); color:#fff;
  font-size:15px; font-weight:700; margin-top:4px;
}
.login-btn:active{ opacity:0.85; }
.logout-btn{
  background:none; border:1px solid rgba(239,233,216,0.3); color:#EFE9D8; padding:6px 8px; border-radius:6px;
  font-size:11px; width:100%; margin-top:8px;
}
@media (max-width:480px){
  .login-card{ padding:26px 20px 22px 20px; border-radius:14px; }
  .login-brand .mark{ font-size:26px; }
}

/* ===== Boot loading screen (shown before app is ready) ===== */
.boot-wrap{
  position:fixed; inset:0; z-index:998; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:14px; background:var(--paper);
}
.boot-wrap .mark{ font-family:'Zilla Slab',serif; font-weight:700; font-size:26px; color:var(--ink); }
.boot-spinner{
  width:34px; height:34px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--gold);
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.boot-msg{ font-size:13px; color:var(--muted); }

#printRoot{ display:none; }

// ---------------------------------------------------------------
// CROSS-DEVICE MERGE
// The old sync sent the whole state and let "last write win". That meant a
// phone with stale data could overwrite everything the laptop had just done.
// Instead we now merge record-by-record: every record carries an `updatedAt`
// stamp, and the newer copy of each id wins. Deletions leave a tombstone so
// the other device doesn't quietly resurrect a product you removed.
// ---------------------------------------------------------------
function nowIso(){ return new Date().toISOString(); }

// Call this whenever a record is created or edited.
function touch(rec){ if(rec) rec.updatedAt = nowIso(); return rec; }

// Call this INSTEAD of just dropping a record, so the delete survives a sync.
function tombstone(id){
  if(!id) return;
  if(!Array.isArray(state.tombstones)) state.tombstones = [];
  state.tombstones = state.tombstones.filter(x=> x && x.id !== id);
  state.tombstones.push({ id: id, at: nowIso() });
}

// Union two lists of records by id; for a clash the newer `updatedAt` wins.
// A record deleted after its last edit stays deleted.
function mergeCollection(localArr, remoteArr, deletedMap){
  const out = new Map();
  const put = (rec)=>{
    if(!rec || !rec.id) return;
    const deletedAt = deletedMap.get(rec.id);
    if(deletedAt && deletedAt >= (rec.updatedAt || '')) return; // removed on purpose
    const prev = out.get(rec.id);
    // ISO strings compare correctly as plain strings, so no Date parsing needed.
    // A record with no stamp at all (older data, or a field the Google Sheet
    // dropped) loses to one that has a stamp — and local wins a total tie,
    // because local is what the shopkeeper is looking at right now.
    if(!prev || (rec.updatedAt || '') > (prev.updatedAt || '')) out.set(rec.id, rec);
  };
  (Array.isArray(localArr)  ? localArr  : []).forEach(put);
  (Array.isArray(remoteArr) ? remoteArr : []).forEach(put);
  return Array.from(out.values());
}

function mergeList(a, b, fallback){
  const out = Array.from(new Set([].concat(Array.isArray(a)?a:[], Array.isArray(b)?b:[]))).filter(Boolean);
  return out.length ? out : fallback.slice();
}

function mergeStates(local, remote){
  // Newest tombstone per id wins.
  const deletedMap = new Map();
  [].concat(Array.isArray(local.tombstones)?local.tombstones:[],
            Array.isArray(remote.tombstones)?remote.tombstones:[])
    .forEach(x=>{
      if(!x || !x.id) return;
      const prev = deletedMap.get(x.id) || '';
      if((x.at || '') > prev) deletedMap.set(x.id, x.at || '');
    });
  // Forget tombstones after 60 days so the sync payload stays small.
  const cutoff = new Date(Date.now() - 60*86400000).toISOString();
  const keptTombs = Array.from(deletedMap.entries())
    .filter(pair=> pair[1] > cutoff)
    .map(pair=> ({ id: pair[0], at: pair[1] }));

  const ls = local.settings || {}, rs = remote.settings || {};
  return {
    products:   mergeCollection(local.products,  remote.products,  deletedMap),
    customers:  mergeCollection(local.customers, remote.customers, deletedMap),
    sales:      mergeCollection(local.sales,     remote.sales,     deletedMap),
    expenses:   mergeCollection(local.expenses,  remote.expenses,  deletedMap),
    tombstones: keptTombs,
    settings: {
      // This device's own language choice sticks — it isn't shop-wide data.
      lang: ls.lang || rs.lang || 'en',
      categories:        mergeList(ls.categories,        rs.categories,        DEFAULT_CATEGORIES),
      expenseCategories: mergeList(ls.expenseCategories, rs.expenseCategories, DEFAULT_EXPENSE_CATS),
      lastSynced: nowIso()
    }
  };
}
// Local-date keys — NOT toISOString(), which is UTC. In Pakistan (UTC+5) that
// made every sale between 12am and 5am count as "yesterday", so "Sales Today"
// and the 7-day chart were wrong for early-morning shifts.
function dayKey(d){
  const x = (d instanceof Date) ? d : new Date(d);
  return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');
}
function todayStr(){ return dayKey(new Date()); }
function isToday(iso){ return dayKey(iso) === todayStr(); }
function isThisMonth(iso){ const d=new Date(iso), n=new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth(); }

async function loadData(){
  try{
    const raw = await storageGet('shopdata');
    if(raw){ state = JSON.parse(raw); }
  }catch(e){ /* no data yet */ }
  if(!state.products) state.products = [];
  if(!state.customers) state.customers = [];
  if(!state.sales) state.sales = [];
  if(!state.expenses) state.expenses = [];
  if(!Array.isArray(state.tombstones)) state.tombstones = [];
  if(!state.settings) state.settings = { lang: 'en' };
  if(!Array.isArray(state.settings.categories) || !state.settings.categories.length){
    state.settings.categories = DEFAULT_CATEGORIES.slice();
  }
  if(!Array.isArray(state.settings.expenseCategories) || !state.settings.expenseCategories.length){
    state.settings.expenseCategories = DEFAULT_EXPENSE_CATS.slice();
  }
  lang = state.settings.lang || 'en';
  dataLoaded = true;
}

// Storage abstraction: uses Claude's window.storage when this page is previewed
// inside Claude's artifact viewer; falls back to the browser's own localStorage
// when the file is opened directly (double-clicked, hosted, etc.) — which is how
// this app runs once downloaded and used as a real standalone tool.
const hasClaudeStorage = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');
async function storageGet(key){
  if(hasClaudeStorage){
    try{
      const res = await window.storage.get(key, false);
      return res ? res.value : null;
    }catch(e){ return null; }
  }
  try{ return window.localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasClaudeStorage){
    try{ await window.storage.set(key, value, false); return true; }catch(e){ /* fall through to localStorage */ }
  }
  try{ window.localStorage.setItem(key, value); return true; }catch(e){ return false; }
}

}

// The single most important safety net for a shop: the whole dataset as one
// small JSON file the shopkeeper can WhatsApp to themselves and restore on any
// device, with or without internet.
function openBackupModal(){
  openModal(`
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-head"><h3>${t('backup_title')}</h3><button class="modal-close" id="modalClose">×</button></div>
      <div class="modal-body">
        <p style="font-size:13px; color:var(--muted); line-height:1.7; margin:0 0 16px 0;">${t('backup_desc')}</p>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn gold" id="doBackup">${t('backup_download')}</button>
          <button class="btn outline" id="doRestore">${t('backup_restore_btn')}</button>
        </div>
        <div style="margin-top:16px; font-size:12px; color:var(--muted);">
          ${t('cloud_sync_last_synced')}: ${state.settings && state.settings.lastSynced ? new Date(state.settings.lastSynced).toLocaleString() : '—'}
        </div>
      </div>
      <div class="modal-foot"><button class="btn outline" id="modalCancel">${t('close')}</button></div>
    </div>
  </div>`);

  document.getElementById('doBackup').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Dashborad-backup-${todayStr()}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    showToast(t('backup_downloaded'));
  };

  document.getElementById('doRestore').onclick = ()=>{
    const input = document.getElementById('restoreFileInput');
    input.value = '';
    input.onchange = ()=>{
      const file = input.files && input.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(!data || typeof data !== 'object' || !Array.isArray(data.products)) throw new Error('bad file');
          if(!confirm(t('backup_restore_confirm'))) return;
          state = {
            products: Array.isArray(data.products) ? data.products : [],
            customers: Array.isArray(data.customers) ? data.customers : [],
            sales: Array.isArray(data.sales) ? data.sales : [],
            expenses: Array.isArray(data.expenses) ? data.expenses : [],
            // Keep the backup's deletion record, else restoring would revive
            // every product/customer this shop had already removed.
            tombstones: Array.isArray(data.tombstones) ? data.tombstones : [],
            settings: Object.assign({lang: lang}, data.settings || {})
          };
          if(!Array.isArray(state.settings.categories) || !state.settings.categories.length) state.settings.categories = DEFAULT_CATEGORIES.slice();
          if(!Array.isArray(state.settings.expenseCategories) || !state.settings.expenseCategories.length) state.settings.expenseCategories = DEFAULT_EXPENSE_CATS.slice();
          lang = state.settings.lang || lang;
          await storageSet('shopdata', JSON.stringify(state));
          closeModal();
          render();
          showToast(t('backup_restored'));
        }catch(err){
          showToast(t('backup_failed'));
        }
      };
      reader.readAsText(file);
    };
    input.click();
  };
}

// IMPORTANT: nothing in this screen calls renderContent() while the shopkeeper is
// typing. A full re-render destroys the <input> that has focus, which is why the
// on-screen keyboard used to snap shut and the mouse cursor jumped away on every
// keystroke. Instead each piece of the screen is refreshed on its own.

// Single source of truth for the money maths — discount is a RUPEE amount now.
function cartMath(){
  const subtotal = cart.reduce((a,i)=>a+i.price*i.qty,0);
  const discountAmt = Math.min(subtotal, Math.max(0, discountRs||0));
  const total = subtotal - discountAmt;
  const cash = parseFloat(cashReceived);
  const change = (payMethod==='cash' && cashReceived!=='' && isFinite(cash)) ? (cash - total) : null;
  return {subtotal, discountAmt, total, change};
}

function posTotalsHtml(){
  const m = cartMath();
  return `
    <div class="cart-line"><span>${t('subtotal')}</span><span class="amount">${fmt(m.subtotal)}</span></div>
    <div class="cart-line"><span>${t('discount_rs')}</span><span class="amount">−${fmt(m.discountAmt)}</span></div>
    <div class="cart-line total"><span>${t('total')}</span><span class="amount">${fmt(m.total)}</span></div>
    ${m.change!==null?`<div class="cart-line" style="font-weight:700; color:${m.change<0?'var(--brick)':'var(--ink)'};"><span>${t('change_due')}</span><span class="amount">${fmt(m.change)}</span></div>`:''}`;
}

/* ---- targeted refreshers: never touch a focused input ---- */
function refreshPosTotals(){
  const el = document.getElementById('posTotals');

  if(btn) btn.disabled = cart.length===0;

function refreshCart(){
  const el = document.getElementById('cartItems');
  if(!el) return;
  el.innerHTML = cartItemsHtml();

// ================= CLOUD SYNC (Google Sheet via Apps Script) =================
// Runs silently in the background. Every device merges rather than overwrites:
// see mergeStates() above. Two rules keep multi-device use safe:
//   1. Never push before the first pull of this session has finished — otherwise
//      a device that was opened with stale data would flatten the newer copy.
//   2. Always pull-and-merge on startup, on refocus, and when the network
//      returns, so a second device fills itself in without any manual step.

let cloudSyncTimer = null;
let firstPullDone = false;   // gate on rule 1
let pendingPush   = false;   // an edit that arrived while we were still pulling
let lastPullAt    = 0;       // throttle for the refocus/online triggers
let syncingNow    = false;   // stops overlapping syncs stepping on each other

function scheduleCloudSync(){
  if(!CLOUD_SHEET_URL) return;
  // An edit before the first pull is remembered, then pushed once merge is done.
  if(!firstPullDone){ pendingPush = true; return; }
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(()=>{
    syncState = 'busy'; updateSyncPill();
    pushToSheet(CLOUD_SHEET_URL).then(ok=>{
      syncState = ok ? 'ok' : 'err';
      if(ok){ state.settings.lastSynced = nowIso(); storageSet('shopdata', JSON.stringify(state)); }
      // Only the small sidebar pill updates — nothing interrupts the counter.
      updateSyncPill();
    });
  }, 1500); // debounce so rapid edits (e.g. qty +/-) don't spam the network
}

// Pull the cloud copy, merge it into whatever this device has, save, redraw.
// This is what actually fixes "a new device shows nothing until incognito".
async function syncNow(opts){
  const o = opts || {};
  if(!CLOUD_SHEET_URL || syncingNow) return false;
  // Don't hammer Apps Script on every tab switch.
  if(!o.force && Date.now() - lastPullAt < 20000) return false;
  syncingNow = true;
  syncState = 'busy'; updateSyncPill();

  const remote = await fetchRemote(CLOUD_SHEET_URL);
  lastPullAt = Date.now();

  if(!remote){
    // Offline or Apps Script asleep — keep working on local data, say nothing scary.
    syncingNow = false;
    firstPullDone = true;
    syncState = 'err'; updateSyncPill();
    if(pendingPush){ pendingPush = false; scheduleCloudSync(); }
    if(o.announce) showToast(t('sync_offline'));
    return false;
  }

  const before = JSON.stringify([state.products, state.customers, state.sales, state.expenses]);
  state = mergeStates(state, remote);
  lang = state.settings.lang || lang;
  const changed = JSON.stringify([state.products, state.customers, state.sales, state.expenses]) !== before;

  await storageSet('shopdata', JSON.stringify(state));
  firstPullDone = true;
  syncingNow = false;
  syncState = 'ok'; updateSyncPill();

  // Push the merged result back so the cloud also gains whatever was local-only.
  scheduleCloudSync();
  if(pendingPush) pendingPush = false;

  // Redraw only if the numbers actually moved, and never mid-typing.
  if(changed && !isTypingInAField()) render();
  if(o.announce) showToast(changed ? t('sync_updated') : t('sync_uptodate'));
  return true;
}

// Never yank the screen out from under someone filling in a field.
function isTypingInAField(){
  const el = document.activeElement;
  return !!(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT'));
}

async function pingSheet(url){
  try{
    const res = await fetch(url + (url.includes('?')?'&':'?') + 'action=ping');
    const data = await res.json();
    return !!(data && data.success);
  }catch(e){ return false; }
}

// Reads the cloud copy WITHOUT touching `state` — the caller merges it.
async function fetchRemote(url){
  if(!url) return null;
  try{
    const res = await fetch(url + (url.includes('?')?'&':'?') + 'action=load');
    const data = await res.json();
    if(!(data && data.success)) return null;
    const s = data.settings || {};
    return {
      products:  Array.isArray(data.products)  ? data.products  : [],
      customers: Array.isArray(data.customers) ? data.customers : [],
      sales:     Array.isArray(data.sales)     ? data.sales     : [],
      expenses:  Array.isArray(data.expenses)  ? data.expenses  : [],
      // Older Apps Script versions know nothing about tombstones; accept them
      // at the top level or tucked inside settings, and cope with neither.
      tombstones: Array.isArray(data.tombstones) ? data.tombstones
                : (Array.isArray(s.tombstones)   ? s.tombstones : []),
      settings: s
    };
  }catch(e){ return null; }
}

async function pushToSheet(url){
  if(!url) return false;
  try{
    // Sends structured rows (not a single JSON blob) so the Google Sheet stays
    // human-readable: separate tabs for Products, Customers, Sales, Sale Items, Expenses.
    const tombs = Array.isArray(state.tombstones) ? state.tombstones : [];
    const payload = {
      action: 'save',
      products: state.products,
      customers: state.customers,
      sales: state.sales,
      expenses: state.expenses,
      // Sent at the top level for the current Apps Script, and mirrored inside
      // settings so an older script that only copies `settings` still relays them.
      tombstones: tombs,
      settings: {
        lang: (state.settings && state.settings.lang) || 'en',
        categories: getCategories(),
        expenseCategories: getExpenseCats(),
        tombstones: tombs
      }
    };
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    return !!(data && data.success);
  }catch(e){ return false; }
}

// ---------------------------------------------------------------------------
// THERMAL SLIP PRINTING
//
// The old approach printed the live app page. Two problems:
//   * #app has min-height:100vh. During printing 1vh = one full page, so the
//     page always overflowed past the printable area (browser margins) and a
//     second, blank page came out. That was the "2 papers, 1 khali" bug.
//   * Mobile Chrome largely ignores @page { size: ... }, so it fell back to
//     Letter/A4 and the slip printed tiny in the corner of a big sheet.
//
// Now we build a *separate*, self-contained slip node (#printRoot) with its
// width fixed in millimetres, measure its real height off-screen, and print
// ONLY that node with every other element removed from the print flow. One
// page, exact paper width, no blank sheet.
// ---------------------------------------------------------------------------
function slipHtml(sale, wmm){
  const contentW = wmm <= 58 ? 50 : 72;   // real printable width of 58mm / 80mm rolls
  const fs = wmm <= 58 ? 10.5 : 12;
  const sm = fs - 1.5;
  const dash = `<div style="border-top:1px dashed #000; margin:4px 0;"></div>`;
  const row = (l,r,extra)=>`<div style="display:flex; justify-content:space-between; gap:6px; ${extra||''}"><span>${l}</span><span style="white-space:nowrap;">${r}</span></div>`;
  const items = sale.items.map(i=>`
    <div style="margin:2px 0;">
      <div>${esc(i.name)}</div>
      ${row(`${i.qty} × ${fmt(i.price)}`, fmt(i.price*i.qty), `font-size:${sm}px;`)}
    </div>`).join('');
  return `
  <div style="width:${contentW}mm; margin:0 auto; padding:2mm 0 3mm 0; box-sizing:border-box;
              font-family:'IBM Plex Mono','Courier New',monospace; font-size:${fs}px; line-height:1.35;
              color:#000; background:#fff; direction:${lang==='ur'?'rtl':'ltr'};">
    <div style="text-align:center; font-weight:700; font-size:${fs+3}px;">${esc(SHOP_NAME)}</div>
    <div style="text-align:center; font-size:${sm}px;">${t('receipt_title')}</div>
    ${dash}
    ${row(t('receipt_no'), '#'+sale.id.slice(-6).toUpperCase())}
    ${row(t('receipt_date'), new Date(sale.date).toLocaleString())}
    ${row(t('receipt_customer'), esc(sale.customerName||t('walkin')))}
    ${sale.customerPhone ? row(t('th_phone'), esc(sale.customerPhone)) : ''}
    ${dash}
    ${items}
    ${dash}
    ${row(t('receipt_subtotal'), fmt(sale.subtotal))}
    ${row(t('receipt_discount'), '−'+fmt(sale.subtotal - sale.total))}
    ${row(t('receipt_total'), fmt(sale.total), `font-weight:700; font-size:${fs+2}px; margin-top:2px;`)}
    ${row(t('payment_label'), t(sale.payment))}
    ${sale.cashReceived!=null ? row(t('cash_received'), fmt(sale.cashReceived)) + row(t('change_due'), fmt(sale.cashReceived - sale.total)) : ''}
    ${dash}
    <div style="text-align:center; font-size:${sm}px;">${t('receipt_thanks')}</div>
  </div>`;
}

function printThermalSlip(sale){
  // The report print style, if any, must not fight with this one.
  const old = document.getElementById('printPageStyle');
  if(old) old.textContent = '';

  let root = document.getElementById('printRoot');
  if(!root){ root = document.createElement('div'); root.id = 'printRoot'; document.body.appendChild(root); }
  root.innerHTML = slipHtml(sale, slipWidth);

  // Measure the slip at its true print width, off-screen.
  root.style.cssText = 'display:block; position:absolute; left:-10000px; top:0; width:'+slipWidth+'mm;';
  const hPx = root.firstElementChild ? root.firstElementChild.offsetHeight : 400;
  root.style.cssText = '';                                  // back to hidden
  const hMm = Math.ceil(hPx / 96 * 25.4) + 4;               // 4mm feed margin

  let st = document.getElementById('slipPageStyle');
  if(!st){ st = document.createElement('style'); st.id = 'slipPageStyle'; document.head.appendChild(st); }
  st.textContent = `
    @media print{
      @page{ size:${slipWidth}mm ${hMm}mm; margin:0; }
      html, body{ margin:0 !important; padding:0 !important; width:${slipWidth}mm !important;
                  height:auto !important; min-height:0 !important; background:#fff !important; }
      /* kill the app shell's 100vh so no blank second page is generated */
      body.printing-slip > *{ display:none !important; }
      body.printing-slip > #printRoot{ display:block !important; width:${slipWidth}mm !important; }
      body.printing-slip #app, body.printing-slip .main, body.printing-slip .content{
        min-height:0 !important; height:auto !important;
      }
      body.printing-slip #printRoot *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    }`;

  document.body.classList.add('printing-slip');
  const cleanup = ()=>{ document.body.classList.remove('printing-slip'); window.onafterprint = null; };
  window.onafterprint = cleanup;
  setTimeout(()=>{ window.print(); setTimeout(cleanup, 2000); }, 80);
}

// A4 portrait print style, used only by the Reports → Export PDF button.
function applyPrintPageSize(){
  let styleTag = document.getElementById('printPageStyle');
  if(!styleTag){
    styleTag = document.createElement('style');
    styleTag.id = 'printPageStyle';
    document.head.appendChild(styleTag);
  }
  const slip = document.getElementById('slipPageStyle');
  if(slip) slip.textContent = '';
  styleTag.textContent = `
    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      html, body { height:auto !important; min-height:0 !important; }
      #app, .main, .content { min-height:0 !important; height:auto !important; }
      .content { padding:0 !important; }
      .tabs, .quick-actions { display:none !important; }
      .print-report-header { display:block !important; margin-bottom:12px; }
      body.print-report-mode .no-print { display:none !important; }
    }`;
}

// ================= HELPERS =================
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function openModal(html){
  const wrap = document.createElement('div');
  wrap.id = 'modalRoot';
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalCancel').onclick = closeModal;
}
function closeModal(){
  const el = document.getElementById('modalRoot');
  if(el) el.remove();
  editingProduct = null; editingCustomer = null; viewingCustomer = null;
}

// ================= EVENT HANDLERS =================
function attachContentHandlers(){
  document.querySelectorAll('[data-nav]').forEach(b=> b.onclick = ()=>{
    view=b.dataset.nav;
    document.getElementById('sidebar').classList.remove('open');
    const ov = document.getElementById('sidebarOverlay'); if(ov) ov.classList.remove('show');
    render();
  });

  if(view==='products'){
    document.getElementById('addProductBtn').onclick = ()=>{ editingProduct=null; openModal(productFormModal(null)); bindProductForm(null); };
    document.getElementById('prodSearch').oninput = e=>{ productSearch=e.target.value; refreshProductTable(); };
    document.getElementById('prodCatFilter').onchange = e=>{ productFilterCat=e.target.value; refreshProductTable(); };
    bindProductRows();
  }

  if(view==='categories'){
    document.getElementById('addCategoryBtn').onclick = ()=>{
      openModal(categoryFormModal(false));
      document.getElementById('modalSave').onclick = ()=>{
        const name = document.getElementById('f_catname').value.trim();
        if(!name){ showToast(lang==='ur'?'نام لکھیں':'Enter a name'); return; }
        const cats = getCategories();
        if(cats.some(c=>c.toLowerCase()===name.toLowerCase())){ showToast(t('category_exists')); return; }
        state.settings.categories = cats.concat([name]);
        saveData(); closeModal(); renderContent(); showToast(t('category_added'));
      };
    };
    document.getElementById('addExpenseCatBtn').onclick = ()=>{
      openModal(categoryFormModal(true));
      document.getElementById('modalSave').onclick = ()=>{
        const name = document.getElementById('f_catname').value.trim();
        if(!name){ showToast(lang==='ur'?'نام لکھیں':'Enter a name'); return; }
        const cats = getExpenseCats();
        if(cats.some(c=>c.toLowerCase()===name.toLowerCase())){ showToast(t('category_exists')); return; }
        state.settings.expenseCategories = cats.concat([name]);
        saveData(); closeModal(); renderContent(); showToast(t('category_added'));
      };
    };
    document.querySelectorAll('[data-del-category]').forEach(b=> b.onclick=()=>{
      if(!confirm(t('confirm_del_category'))) return;
      const name = b.dataset.delCategory;
      state.settings.categories = getCategories().filter(c=>c!==name);
      saveData(); renderContent(); showToast(t('category_deleted'));
    });
    document.querySelectorAll('[data-del-exp-category]').forEach(b=> b.onclick=()=>{
      if(!confirm(t('confirm_del_category'))) return;
      const name = b.dataset.delExpCategory;
      state.settings.expenseCategories = getExpenseCats().filter(c=>c!==name);
      saveData(); renderContent(); showToast(t('category_deleted'));
    });
  }

  if(view==='pos'){
    // Every handler below updates only the part of the screen that changed, so the
    // input the shopkeeper is typing in keeps its focus (and the phone keyboard stays up).
    document.getElementById('posSearch').oninput = e=>{ productSearch = e.target.value; refreshPosTiles(); };
    refreshPosTiles();
    bindCartRows();
    const clearBtn = document.getElementById('clearCart');
    if(clearBtn) clearBtn.onclick=()=>{ cart=[]; refreshCart(); };

    const custSel = document.getElementById('posCustomer');
    custSel.onchange = e=>{
      selectedCustomerId = e.target.value;
      const wrap = document.getElementById('posNewCustWrap');
      wrap.style.display = selectedCustomerId==='__new' ? 'block' : 'none';
      if(selectedCustomerId==='__new'){ const n=document.getElementById('posNewName'); if(n) n.focus(); }
    };
    const nName = document.getElementById('posNewName');
    const nPhone = document.getElementById('posNewPhone');
    if(nName) nName.oninput = e=>{ posNewCust.name = e.target.value; };
    if(nPhone) nPhone.oninput = e=>{ posNewCust.phone = e.target.value; };

    document.getElementById('posDiscount').oninput = e=>{
      discountRs = Math.max(0, parseFloat(e.target.value)||0);
      refreshPosTotals();
    };
    const cashEl = document.getElementById('posCash');
    if(cashEl) cashEl.oninput = e=>{ cashReceived = e.target.value; refreshPosTotals(); };

    document.querySelectorAll('[data-pay]').forEach(b=> b.onclick=()=>{
      payMethod = b.dataset.pay;
      document.querySelectorAll('[data-pay]').forEach(x=> x.classList.toggle('sel', x.dataset.pay===payMethod));
      document.getElementById('posCashWrap').style.display = payMethod==='cash' ? 'flex' : 'none';
      refreshPosTotals();
    });

    const checkoutBtn = document.getElementById('checkoutBtn');
    if(checkoutBtn) checkoutBtn.onclick = checkout;
  }

  if(view==='inventory'){
    document.querySelectorAll('[data-stock-adj]').forEach(b=> b.onclick=()=>{
      const [id,delta] = b.dataset.stockAdj.split(':');
      const p = state.products.find(x=>x.id===id);
      if(p){ p.stock = Math.max(0, p.stock + parseInt(delta)); touch(p); saveData(); renderContent(); showToast('Stock updated'); }
    });
  }

  if(view==='customers'){
    document.getElementById('addCustomerBtn').onclick = ()=>{ openModal(customerFormModal(null)); bindCustomerForm(null); };
    document.getElementById('custSearch').oninput = e=>{ customerSearch=e.target.value; refreshCustomerTable(); };
    bindCustomerRows();
  }

  if(view==='expenses'){
    document.getElementById('addExpenseBtn').onclick = ()=>{ openModal(expenseFormModal()); bindExpenseForm(); };
    document.getElementById('expCatFilter').onchange = e=>{ expenseFilterCat=e.target.value; renderContent(); };
    document.querySelectorAll('[data-del-expense]').forEach(b=> b.onclick=()=>{
      if(confirm('Delete this expense?')){ tombstone(b.dataset.delExpense); state.expenses = state.expenses.filter(x=>x.id!==b.dataset.delExpense); saveData(); renderContent(); showToast('Expense deleted'); }
    });
  }

  if(view==='reports'){
    document.querySelectorAll('[data-range]').forEach(b=> b.onclick=()=>{ reportRange=b.dataset.range; renderContent(); });
    const exportBtn = document.getElementById('exportPdfBtn');
    if(exportBtn) exportBtn.onclick = ()=>{
      applyPrintPageSize();
      document.body.classList.add('print-report-mode');
      window.onafterprint = ()=>{ document.body.classList.remove('print-report-mode'); window.onafterprint = null; };
      window.print();
    };
  }
}

function bindProductForm(product){
  document.getElementById('modalSave').onclick = ()=>{
    const name = document.getElementById('f_name').value.trim();
    const category = document.getElementById('f_category').value;
    const cost = parseFloat(document.getElementById('f_cost').value)||0;
    const price = parseFloat(document.getElementById('f_price').value)||0;
    const stock = parseInt(document.getElementById('f_stock').value)||0;
    if(!name){ showToast('Please enter a product name'); return; }
    if(product){
      Object.assign(product, {name,category,cost,price,stock}); touch(product);
    }else{
      state.products.push(touch({id:uid(), name, category, cost, price, stock}));
    }
    saveData(); closeModal(); renderContent(); showToast(product?'Product updated':'Product added');
  };
}
function bindCustomerForm(customer){
  document.getElementById('modalSave').onclick = ()=>{
    const name = document.getElementById('f_cname').value.trim();
    const phone = document.getElementById('f_cphone').value.trim();
    if(!name){ showToast('Please enter a name'); return; }
    if(customer){ Object.assign(customer, {name, phone}); touch(customer); }
    else{ state.customers.push(touch({id:uid(), name, phone, paidOff:0})); }
    saveData(); closeModal(); renderContent(); showToast(customer?'Customer updated':'Customer added');
  };
}
function bindExpenseForm(){
  document.getElementById('modalSave').onclick = ()=>{
    const category = document.getElementById('f_ecategory').value;
    const amount = parseFloat(document.getElementById('f_eamount').value)||0;
    const note = document.getElementById('f_enote').value.trim();
    const date = document.getElementById('f_edate').value || todayStr();
    if(amount<=0){ showToast('Enter a valid amount'); return; }
    // Store at local noon so the date can never drift a day either way.
    state.expenses.push(touch({id:uid(), category, amount, note, date: new Date(date + 'T12:00:00').toISOString()}));
    saveData(); closeModal(); renderContent(); showToast('Expense added');
  };
}

function addToCart(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p || p.stock<=0) return;
  const existing = cart.find(i=>i.productId===productId);
  const inCartQty = existing?existing.qty:0;
  if(inCartQty+1 > p.stock){ showToast('Not enough stock'); return; }
  if(existing){ existing.qty++; }
  else{ cart.push({productId:p.id, name:p.name, price:p.price, cost:p.cost, qty:1}); }
  refreshCart();
}
function changeQty(productId, delta){
  const item = cart.find(i=>i.productId===productId);
  const p = state.products.find(x=>x.id===productId);
  if(!item) return;
  const newQty = item.qty + delta;
  if(newQty<=0){ cart = cart.filter(i=>i.productId!==productId); }
  else if(p && newQty > p.stock){ showToast('Not enough stock'); return; }
  else{ item.qty = newQty; }
  refreshCart();
}

function checkout(){
  if(cart.length===0) return;
  const m = cartMath();

  // Resolve the customer: an existing one from the dropdown, or a brand-new one
  // typed straight into the POS. If a phone number matches somebody we already
  // have, reuse that record instead of creating a duplicate.
  let customer = null;
  if(selectedCustomerId === '__new'){
    const nm = (posNewCust.name||'').trim();
    const ph = (posNewCust.phone||'').trim();
    const phDigits = ph.replace(/\D/g,'');
    if(nm || phDigits){
      if(phDigits) customer = state.customers.find(c=> (c.phone||'').replace(/\D/g,'') === phDigits) || null;
      if(customer){ if(nm) customer.name = nm; if(ph) customer.phone = ph; touch(customer); }
      else{
        customer = {id:uid(), name: nm || ph, phone: ph, paidOff:0};
        touch(customer); state.customers.push(customer);
      }
    }
  } else if(selectedCustomerId){
    customer = state.customers.find(c=>c.id===selectedCustomerId) || null;
  }

  // A credit sale with no customer is untrackable udhaar — block it.
  if(payMethod === 'credit' && !customer){ showToast(t('credit_needs_customer')); return; }

  const cash = parseFloat(cashReceived);
  const sale = {
    id: uid(),
    date: new Date().toISOString(),
    items: cart.map(i=>({productId:i.productId, name:i.name, qty:i.qty, price:i.price, cost:i.cost})),
    subtotal: m.subtotal,
    discountRs: m.discountAmt,
    // kept so older records and any % reporting still line up
    discountPct: m.subtotal>0 ? Math.round((m.discountAmt/m.subtotal)*10000)/100 : 0,
    total: m.total,
    payment: payMethod,
    cashReceived: (payMethod==='cash' && cashReceived!=='' && isFinite(cash)) ? cash : null,
    customerId: customer ? customer.id : null,
    customerName: customer ? customer.name : null,
    customerPhone: customer ? (customer.phone || null) : null
  };
  // decrement stock
  cart.forEach(i=>{
    const p = state.products.find(x=>x.id===i.productId);
    if(p){ p.stock = Math.max(0, p.stock - i.qty); touch(p); }
  });
  touch(sale); state.sales.push(sale);
  saveData();
  lastReceipt = sale;
  cart = []; discountRs = 0; cashReceived = ''; posNewCust = {name:'', phone:''};
  payMethod = 'cash'; selectedCustomerId = '';
  showReceiptScreen(sale);
}

function showReceiptScreen(sale){
  const content = document.getElementById('content');
  document.querySelector('.topbar h1').textContent = t('receipt_title');
  content.innerHTML = receiptView(sale);
  bindReceiptActions(sale);
}

function bindReceiptActions(sale){
  document.querySelectorAll('[data-slip]').forEach(b=> b.onclick = ()=>{
    slipWidth = parseInt(b.dataset.slip);
    document.getElementById('content').innerHTML = receiptView(sale);
    bindReceiptActions(sale);
  });
  document.getElementById('printReceipt').onclick = ()=> printThermalSlip(sale);
  document.getElementById('downloadReceipt').onclick = ()=>{
    const blob = new Blob([receiptText(sale)], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `receipt-${sale.id.slice(-6)}.txt`;
    a.click();
  };
  document.getElementById('whatsappReceipt').onclick = ()=>{
    const text = encodeURIComponent(receiptText(sale));
    window.open(`https://wa.me/?text=${text}`, '_blank');
  };
  document.getElementById('newSaleBtn').onclick = ()=>{ view='pos'; render(); };
}

// ================= BOOT SCREEN =================
function renderBoot(msg){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="boot-wrap">
      <div class="mark">Dashborad</div>
      <div class="boot-spinner"></div>
      <div class="boot-msg">${esc(msg)}</div>
    </div>`;
}

// ================= INIT =================
async function startApp(){
  // Show an immediate "loading" screen instead of a blank page, so the
  // shopkeeper always sees *something* happening the moment they log in.
  renderBoot(lang==='ur' ? 'ڈیٹا لایا جا رہا ہے…' : 'Loading your shop…');

  // Local read first — this is fast (device storage), so the real app
  // appears within a moment even with no internet at all.
  await loadData();
  render();

  // THEN always pull-and-merge from the cloud — not only when this device is
  // empty. The old code pulled only if local storage was completely blank,
  // which is exactly why a second device showed stale data forever and
  // "incognito mode" appeared to fix it: incognito starts with empty storage,
  // so the pull ran. Worse, a stale device would then push its whole state
  // back and overwrite the newer data. mergeStates() makes the pull safe, so
  // it can now run on every start.
  // Runs in the BACKGROUND — Apps Script can take a few seconds to wake from
  // a cold start, and that must never block the first screen.
  if(CLOUD_SHEET_URL){
    syncNow({ force: true });
  } else {
    firstPullDone = true; // no cloud configured — never hold pushes back
  }

  // Pick up changes made on the other device when this one comes back to life:
  // returning to the tab, or the network coming back after a dead zone.
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && isAuthenticated) syncNow({});
  });
  window.addEventListener('online', ()=> { if(isAuthenticated) syncNow({ force: true }); });
}

toastEl.className = 'toast'; toastEl.id = 'toast';
document.body.appendChild(toastEl);

// App starts at the login screen. Logging in with the right username/password

renderLogin();

})();
